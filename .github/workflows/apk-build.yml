name: Build APK packages

# Builds OpenWrt .apk packages (apk-tools >= 3, OpenWrt >= 25.12) for
# riscv64, arm64 (aarch64) and amd64 (x86_64) using the ci/ Docker image.
# On semver tags the packages are published as a GitHub Release.

on:
  push:
    branches: [ "develop" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64_generic
            name: riscv64
          - arch: aarch64_generic
            name: arm64
          - arch: x86_64
            name: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build apk packaging image
        run: docker build -t sshproxy-openwrt-apk ci/

      - name: Build ${{ matrix.name }} apk package
        env:
          IMAGE: sshproxy-openwrt-apk
        run: sh ci/docker-apk.sh "${{ matrix.arch }}"

      - name: Rename apk to include platform and tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          apkfile=$(basename bin/apk/${{ matrix.arch }}/sshproxy-openwrt-*.apk)
          cp "bin/apk/${{ matrix.arch }}/$apkfile" "dist/sshproxy-openwrt-${{ matrix.name }}-${apkfile#sshproxy-openwrt-}"

      - name: Upload ${{ matrix.name }} apk artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: sshproxy-openwrt-${{ matrix.name }}.apk
          path: dist/sshproxy-openwrt-${{ matrix.name }}-*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all apk artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*/*.apk
